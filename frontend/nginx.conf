# nginx para el build de producción del frontend (Dockerfile.prod).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Archivos con hash en el nombre: caché larga
  location ~* \.(?:js|css|woff2?|ttf|svg|png|jpg|jpeg|gif|ico|webp)$ {
    expires 30d;
    add_header Cache-Control "public, immutable";
    try_files $uri =404;
  }

  # index.html nunca en caché, para que un despliegue nuevo se vea de inmediato
  location = /index.html {
    add_header Cache-Control "no-cache";
  }

  # SPA: cualquier ruta desconocida la resuelve el router de Angular
  location / {
    try_files $uri $uri/ /index.html;
  }

  location = /healthz {
    access_log off;
    return 200 "ok";
  }
}
