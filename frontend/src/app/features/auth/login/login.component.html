<div class="login-page">
  <!-- Fondo: mapa 3D con focos y cuadrícula que se difumina -->
  <div class="login-bg">
    <div class="grid-pattern"></div>
    <div class="grid-shimmer"></div>
    <div class="login-focos" aria-hidden="true"></div>
  </div>

  <div class="login-panel">
    <!-- Logo y marca -->
    <div class="brand">
      <div class="logo">
        <app-logo [size]="56" [animated]="true" />
      </div>
      <h1 class="brand-name">HarmoniWatts</h1>
      <p class="brand-tagline">Sistema Inteligente de Gestión Energética</p>
    </div>

    <h2 class="form-title">Iniciar Sesión</h2>

    <form class="login-form" (ngSubmit)="login()">
      <div class="field">
        <label for="email">Correo electrónico</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><path d="M22 6l-10 7L2 6"/></svg>
          </span>
          <input id="email" type="text" placeholder="usuario@ejemplo.com" [(ngModel)]="email" name="email" autocomplete="username" />
        </div>
      </div>

      <div class="field">
        <label for="password">Contraseña</label>
        <div class="input-wrap">
          <span class="input-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0110 0v4"/></svg>
          </span>
          <input [type]="showPassword ? 'text' : 'password'" id="password" placeholder="···············" [(ngModel)]="password" name="password" autocomplete="current-password" />
          <button type="button" class="toggle-pwd" (click)="showPassword = !showPassword" [attr.aria-label]="showPassword ? 'Ocultar contraseña' : 'Mostrar contraseña'" tabindex="-1">
            @if (!showPassword) {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
            } @else {
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0112 20c-7 0-11-8-11-8a18.45 18.45 0 015.06-5.94M9.9 4.24A9.12 9.12 0 0112 4c7 0 11 8 11 8a18.5 18.5 0 01-2.16 3.19m-6.72-1.07a3 3 0 11-4.24-4.24"/><path d="M1 1l22 22"/></svg>
            }
          </button>
        </div>
      </div>

      <a class="forgot-link" routerLink="/auth/forgot-password">¿Olvidaste tu contraseña?</a>

      @if (errorMessage) {
        <p class="error-msg">{{ errorMessage }}</p>
      }

      <button type="submit" class="btn-primary" [disabled]="loading">
        {{ loading ? 'Entrando...' : 'Iniciar Sesión' }}
      </button>
    </form>

    <div class="divider"><span>o</span></div>

    <button type="button" class="btn-google" (click)="loginWithGoogle()" [disabled]="loading">
      <svg class="google-icon" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/></svg>
      Continuar con Google
    </button>

    <p class="register-link">
      ¿No tienes cuenta? <a routerLink="/auth/register">Regístrate</a>
    </p>
  </div>

  <footer class="login-footer">
    © 2026 HarmoniWatts — Maestría Virtual en Ingeniería de Sistemas
  </footer>
</div>
