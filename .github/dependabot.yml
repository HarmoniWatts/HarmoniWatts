# Actualizaciones automáticas de dependencias (PRs semanales hacia qa).
# Las menores y de parche se agrupan en un solo PR por servicio para no saturar.
version: 2

updates:
  - package-ecosystem: npm
    directory: /frontend
    target-branch: qa
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: build
      include: scope
    groups:
      menores-y-parches:
        update-types: [minor, patch]
