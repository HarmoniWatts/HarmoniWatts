# CI de HarmoniWatts
#
# Se ejecuta en cada PR hacia qa/main/release y en cada push a esas ramas.
# Solo corre los jobs de los servicios que cambiaron (job "changes").
# El job final "CI OK" es el único check que hay que marcar como obligatorio
# en la protección de ramas: queda en verde si todo pasó o se omitió.

name: CI

on:
  pull_request:
    branches: [qa, main, release]
  push:
    branches: [qa, main, release]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  changes:
    name: Detectar cambios
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lista los archivos del PR por la API
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      insights: ${{ steps.filter.outputs.insights }}
      register: ${{ steps.filter.outputs.register }}
      consumption: ${{ steps.filter.outputs.consumption }}
      vivienda: ${{ steps.filter.outputs.vivienda }}
      electrodomesticos: ${{ steps.filter.outputs.electrodomesticos }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # Un cambio en los workflows vuelve a validar todos los servicios.
          filters: |
            ci: &ci
              - '.github/workflows/**'
            frontend:
              - *ci
              - 'frontend/**'
            insights:
              - *ci
              - 'backend/insights-service/**'
            register:
              - *ci
              - 'harmoni-register/**'
            consumption:
              - *ci
              - 'backend/consumption-service/**'
            vivienda:
              - *ci
              - 'harmoniwatts-vivienda-api/**'
            electrodomesticos:
              - *ci
              - 'harmoniwatts-electrodomesticos-api/**'

  frontend:
    name: Frontend (Angular)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Pruebas unitarias (Vitest)
        run: npm run test:ci
      - name: Build de producción (type-check + strict templates + budgets)
        run: npm run build

  node-services:
    name: ${{ matrix.name }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Insights service (Node)
            dir: backend/insights-service
            filter: insights
          - name: Harmoni register (Node)
            dir: harmoni-register
            filter: register
    if: needs.changes.outputs.insights == 'true' || needs.changes.outputs.register == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.filter] == 'true'
      - uses: actions/setup-node@v4
        if: needs.changes.outputs[matrix.filter] == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ${{ matrix.dir }}/package-lock.json
      - if: needs.changes.outputs[matrix.filter] == 'true'
        run: npm ci
      - name: Revisión de sintaxis
        if: needs.changes.outputs[matrix.filter] == 'true'
        run: find . -name '*.js' -not -path './node_modules/*' -print0 | xargs -0 -n1 node --check
      - name: Pruebas unitarias (node --test)
        if: needs.changes.outputs[matrix.filter] == 'true'
        run: npm test

  consumption:
    name: Consumption service (Python)
    needs: changes
    if: needs.changes.outputs.consumption == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/consumption-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: backend/consumption-service/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check --output-format=github .
      - name: Pruebas unitarias (pytest)
        run: pytest -q

  java:
    name: ${{ matrix.name }}
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Vivienda API (Spring Boot)
            dir: harmoniwatts-vivienda-api
            filter: vivienda
          - name: Electrodomésticos API (Spring Boot)
            dir: harmoniwatts-electrodomesticos-api
            filter: electrodomesticos
    if: needs.changes.outputs.vivienda == 'true' || needs.changes.outputs.electrodomesticos == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ matrix.dir }}
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.filter] == 'true'
      - uses: actions/setup-java@v4
        if: needs.changes.outputs[matrix.filter] == 'true'
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: ${{ matrix.dir }}/pom.xml
      - name: Compilar + pruebas unitarias (mvn verify)
        if: needs.changes.outputs[matrix.filter] == 'true'
        run: mvn -B -ntp verify
      - name: Publicar reportes de pruebas
        if: failure() && needs.changes.outputs[matrix.filter] == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: surefire-${{ matrix.filter }}
          path: ${{ matrix.dir }}/target/surefire-reports/

  docker:
    name: Docker build (${{ matrix.filter }})
    needs: changes
    strategy:
      fail-fast: false
      matrix:
        include:
          - { filter: frontend, context: frontend }
          - { filter: insights, context: backend/insights-service }
          - { filter: register, context: harmoni-register }
          - { filter: consumption, context: backend/consumption-service }
          - { filter: vivienda, context: harmoniwatts-vivienda-api }
          - { filter: electrodomesticos, context: harmoniwatts-electrodomesticos-api }
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        if: needs.changes.outputs[matrix.filter] == 'true'
      - uses: docker/setup-buildx-action@v3
        if: needs.changes.outputs[matrix.filter] == 'true'
      - name: Construir imagen (sin publicar)
        if: needs.changes.outputs[matrix.filter] == 'true'
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: false
          cache-from: type=gha,scope=${{ matrix.filter }}
          cache-to: type=gha,mode=max,scope=${{ matrix.filter }}

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Calcular rango de commits a revisar
        id: range
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then
            echo "range=$PR_BASE..$PR_HEAD" >> "$GITHUB_OUTPUT"
          elif [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            echo "range=$BEFORE..$SHA" >> "$GITHUB_OUTPUT"
          else
            echo "range=HEAD~1..HEAD" >> "$GITHUB_OUTPUT"
          fi
      - name: Instalar gitleaks
        env:
          GITLEAKS_VERSION: 8.21.2
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
      - name: Buscar secretos en los commits nuevos
        run: ./gitleaks git --log-opts="${{ steps.range.outputs.range }}" --redact --verbose .

  ci-ok:
    name: CI OK
    if: always()
    needs: [changes, frontend, node-services, consumption, java, docker, secrets]
    runs-on: ubuntu-latest
    steps:
      - name: Verificar resultado de los jobs
        run: |
          echo '${{ toJSON(needs) }}' | jq -e 'all(.[]; .result == "success" or .result == "skipped")' \
            || { echo "::error::Al menos un job falló o fue cancelado"; exit 1; }
