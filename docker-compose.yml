# =============================================================================
# Docker Compose - Keycloak + PostgreSQL (HarmoniWatts)
# Production-ready para sistema de autenticación (ej. frontend Angular)
# =============================================================================
# Todas las credenciales y secrets deben estar en .env (nunca hardcodear aquí).
# Copiar .env.example a .env y completar los valores antes de levantar.
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # PostgreSQL 15+ - Base de datos dedicada para Keycloak
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:15-alpine
    container_name: keycloak-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - keycloak_postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-harmoniwatts-db.sh:/docker-entrypoint-initdb.d/02-harmoniwatts-db.sh:ro
      # Restore automático en primer arranque si existen dumps (ver docs/SNAPSHOTS-BACKUP-RESTORE.md)
      - ./docker/postgres/03-restore-snapshots.sh:/docker-entrypoint-initdb.d/03-restore-snapshots.sh:ro
      - ./docker/snapshots/postgres:/docker-entrypoint-initdb.d/snapshots:ro
    ports:
      # Exponer solo si necesitas conectar desde host (DBeaver, TablePlus, etc.)
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # Keycloak - Identity Provider (última versión estable)
  # ---------------------------------------------------------------------------
  keycloak:
    image: quay.io/keycloak/keycloak:latest
    container_name: keycloak
    restart: unless-stopped
    command:
      # Desarrollo: start-dev (HTTP en 8080). --import-realm importa los JSON de keycloak-realm/ al arrancar.
      # Producción: cambiar a "start" y configurar KC_HOSTNAME/HTTPS según docs (--import-realm solo en start-dev).
      - start-dev
      - --import-realm
    environment:
      # Admin inicial (solo para bootstrap; cambiar en primer acceso en producción)
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      # Base de datos PostgreSQL (no usar H2)
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      KC_DB_USERNAME: ${POSTGRES_USER}
      KC_DB_PASSWORD: ${POSTGRES_PASSWORD}
      # Hostname para que Angular/redirects funcionen (ajustar en producción)
      KC_HOSTNAME: ${KC_HOSTNAME:-localhost}
      KC_HOSTNAME_PORT: ${KC_HOSTNAME_PORT:-8080}
      KC_HTTP_ENABLED: "true"
      # Health para readiness (y para depends_on)
      KC_HEALTH_ENABLED: "true"
      # SMTP: configurar en Admin Console → Realm Settings → Email, o usar variables
      # opcionales (ver .env.example). Keycloak no expone todo SMTP por env en todas las versiones.
      KC_SPI_EMAIL_SMTP_HOST: ${KC_SPI_EMAIL_SMTP_HOST:-}
      KC_SPI_EMAIL_SMTP_PORT: ${KC_SPI_EMAIL_SMTP_PORT:-}
      KC_SPI_EMAIL_SMTP_FROM: ${KC_SPI_EMAIL_SMTP_FROM:-}
      KC_SPI_EMAIL_SMTP_USER: ${KC_SPI_EMAIL_SMTP_USER:-}
      KC_SPI_EMAIL_SMTP_PASSWORD: ${KC_SPI_EMAIL_SMTP_PASSWORD:-}
      KC_SPI_EMAIL_SMTP_SSL_ENABLED: ${KC_SPI_EMAIL_SMTP_SSL_ENABLED:-false}
      KC_SPI_EMAIL_SMTP_STARTTLS: ${KC_SPI_EMAIL_SMTP_STARTTLS:-true}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - keycloak_data:/opt/keycloak/data
      # Realm exportado en keycloak-realm/*.json se importa al arrancar (ver keycloak-realm/README.md).
      - ./keycloak-realm:/opt/keycloak/data/import
    ports:
      - "${KEYCLOAK_HTTP_PORT:-8080}:8080"
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # Microservicio de registro de usuarios (Keycloak Admin API)
  # ---------------------------------------------------------------------------
  harmoni-register:
    build:
      context: ./harmoni-register
      dockerfile: Dockerfile
    container_name: harmoniwatts-harmoni-register
    restart: unless-stopped
    environment:
      PORT: 8081
      KEYCLOAK_URL: http://keycloak:8080
      KEYCLOAK_REALM: ${KEYCLOAK_REALM:-harmoniwatts}
      KEYCLOAK_ADMIN_USERNAME: ${KC_BOOTSTRAP_ADMIN_USERNAME}
      KEYCLOAK_ADMIN_PASSWORD: ${KC_BOOTSTRAP_ADMIN_PASSWORD}
      KEYCLOAK_FRONTEND_CLIENT_ID: ${KEYCLOAK_FRONTEND_CLIENT_ID:-harmoniwatts-frontend}
    ports:
      - "8081:8081"
    depends_on:
      keycloak:
        condition: service_started
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # API viviendas (Spring Boot — solo dominio vivienda; Keycloak vía harmoni-register)
  # ---------------------------------------------------------------------------
  harmoniwatts-vivienda-api:
    build:
      context: ./harmoniwatts-vivienda-api
      dockerfile: Dockerfile
    container_name: harmoniwatts-vivienda-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/harmoniwatts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      # iss del JWT (navegador); debe coincidir con el token emitido por Keycloak
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/${KEYCLOAK_REALM:-harmoniwatts}
      # Claves JWK: URL alcanzable desde el contenedor de la API (red Docker)
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-harmoniwatts}/protocol/openid-connect/certs
    ports:
      - "8082:8082"
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # API electrodomésticos (Spring Boot — CRUD por vivienda; JWT Keycloak)
  # ---------------------------------------------------------------------------
  harmoniwatts-electrodomesticos-api:
    build:
      context: ./harmoniwatts-electrodomesticos-api
      dockerfile: Dockerfile
    container_name: harmoniwatts-electrodomesticos-api
    restart: unless-stopped
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/harmoniwatts
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      KEYCLOAK_ISSUER_URI: http://localhost:8080/realms/${KEYCLOAK_REALM:-harmoniwatts}
      KEYCLOAK_JWK_SET_URI: http://keycloak:8080/realms/${KEYCLOAK_REALM:-harmoniwatts}/protocol/openid-connect/certs
      # Visión en nube con failover: gemini → openai → mistral (docs/VISION-PROVIDERS.md)
      HW_VISION_PROVIDER: ${HW_VISION_PROVIDER:-chain}
      HW_VISION_CHAIN_ORDER: ${HW_VISION_CHAIN_ORDER:-gemini,openai,mistral}
      HW_GEMINI_VISION_MODEL: ${HW_GEMINI_VISION_MODEL:-gemini-3.6-flash}
      HW_MISTRAL_VISION_MODEL: ${HW_MISTRAL_VISION_MODEL:-pixtral-12b-2409}
      HW_OPENAI_VISION_MODEL: ${HW_OPENAI_VISION_MODEL:-gpt-4o-mini}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started
    ports:
      - "${HW_ELECTRODOMESTICOS_API_PORT:-8083}:8083"
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # pgAdmin - Interfaz gráfica web para PostgreSQL (opcional, desarrollo)
  # ---------------------------------------------------------------------------
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: keycloak-pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD:-admin}
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - keycloak-network

  # ---------------------------------------------------------------------------
  # MongoDB — datos de consumo (consumption-service + seed desde BD/datos)
  # ---------------------------------------------------------------------------
  harmoniwatts-mongodb:
    image: mongo:7
    container_name: harmoniwatts-mongodb
    restart: unless-stopped
    ports:
      - "${HW_MONGODB_PORT:-27018}:27017"
    volumes:
      - harmoniwatts_mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s
    networks:
      - harmoniwatts-backend

  # ---------------------------------------------------------------------------
  # Mongo Express — interfaz web para inspeccionar BD/colecciones (desarrollo)
  # ---------------------------------------------------------------------------
  harmoniwatts-mongo-express:
    image: mongo-express:latest
    container_name: harmoniwatts-mongo-express
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://harmoniwatts-mongodb:27017/
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${HW_MONGO_EXPRESS_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${HW_MONGO_EXPRESS_PASSWORD:-changeme}
    ports:
      - "${HW_MONGO_EXPRESS_PORT:-8089}:8081"
    depends_on:
      harmoniwatts-mongodb:
        condition: service_healthy
    networks:
      - harmoniwatts-backend

  # ---------------------------------------------------------------------------
  # Seed Mongo (one-shot): preferir snapshot (mongodump); si no, JSON demo + shift
  # ---------------------------------------------------------------------------
  harmoniwatts-mongo-seed:
    image: mongo:7
    container_name: harmoniwatts-mongo-seed
    networks:
      - harmoniwatts-backend
    depends_on:
      harmoniwatts-mongodb:
        condition: service_healthy
    volumes:
      - ./BD/datos/harmoniwatts.consumos_enriquecidos.json:/seed/consumos.json:ro
      - ./docker/mongo/shift-timestamps.js:/seed/shift-timestamps.js:ro
      - ./docker/mongo/reconcile-contexto.js:/seed/reconcile-contexto.js:ro
      - ./docker/snapshots/mongo:/snapshots/mongo:ro
    entrypoint:
      - bash
      - -c
      - |
        set -e
        URI="mongodb://harmoniwatts-mongodb:27017/harmoniwatts"
        C=$$(mongosh "$$URI" --quiet --eval 'db.consumos_enriquecidos.countDocuments()')
        SNAP="/snapshots/mongo/harmoniwatts"
        if [ "$$C" -gt 0 ]; then
          echo "[harmoniwatts-mongo-seed] Colección ya tiene $$C documentos; omitiendo import."
          echo "[harmoniwatts-mongo-seed] Reconciliando contexto_temporal con timestamp..."
          mongosh "$$URI" /seed/reconcile-contexto.js
        elif [ -d "$$SNAP" ] && [ -n "$$(ls -A "$$SNAP" 2>/dev/null)" ]; then
          echo "[harmoniwatts-mongo-seed] Restaurando snapshot mongodump (sin shift de fechas)..."
          mongorestore --uri="$$URI" --db=harmoniwatts "$$SNAP"
        else
          echo "[harmoniwatts-mongo-seed] Sin snapshot; importando consumos demo (JSON)..."
          mongoimport --uri="$$URI" --collection=consumos_enriquecidos --file=/seed/consumos.json --jsonArray
          echo "[harmoniwatts-mongo-seed] Desplazando timestamps y contexto_temporal (UTC)..."
          mongosh "$$URI" /seed/shift-timestamps.js
        fi
        echo "[harmoniwatts-mongo-seed] Listo."
    restart: "no"

  # ---------------------------------------------------------------------------
  # Consumption service (FastAPI → MongoDB)
  # ---------------------------------------------------------------------------
  harmoniwatts-consumption-service:
    build:
      context: ./backend/consumption-service
      dockerfile: Dockerfile
    container_name: harmoniwatts-consumption-service
    restart: unless-stopped
    environment:
      MONGODB_HOST: harmoniwatts-mongodb
      MONGODB_PORT: "27017"
      MONGODB_DATABASE: harmoniwatts
      ENVIRONMENT: development
      CONSUMPTION_COLLECTION: consumos_enriquecidos
      HOUSEHOLD_ID_TYPE: int
      DEFAULT_TIMEZONE: America/Bogota
    ports:
      - "${HW_CONSUMPTION_SERVICE_PORT:-8001}:8001"
    depends_on:
      harmoniwatts-mongodb:
        condition: service_healthy
      harmoniwatts-mongo-seed:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 25s
    networks:
      - harmoniwatts-backend

  # ---------------------------------------------------------------------------
  # Insights service (Node — agrega consumo + predicción; expone /api/v1/dashboard)
  # ---------------------------------------------------------------------------
  harmoniwatts-insights-service:
    build:
      context: ./backend/insights-service
      dockerfile: Dockerfile
    container_name: harmoniwatts-insights-service
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "7001"
      CONSUMPTION_SERVICE_URL: http://harmoniwatts-consumption-service:8001
      PREDICTION_SERVICE_URL: http://harmoniwatts-consumption-service:8001
      DEFAULT_TIMEZONE: America/Bogota
    ports:
      - "${HW_INSIGHTS_SERVICE_PORT:-7001}:7001"
    depends_on:
      harmoniwatts-consumption-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:7001/health"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - harmoniwatts-backend

  # ---------------------------------------------------------------------------
  # Frontend Angular (ng serve / npm start) — http://localhost:4200
  # El navegador llama a las APIs vía localhost; las URLs están en environment.development.ts
  # ---------------------------------------------------------------------------
  harmoniwatts-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: harmoniwatts-frontend
    restart: unless-stopped
    ports:
      - "${HW_FRONTEND_PORT:-4200}:4200"
    volumes:
      # Hot reload: cambios locales en ./frontend se reflejan en el contenedor
      - ./frontend:/app
      - harmoniwatts_frontend_node_modules:/app/node_modules
    depends_on:
      keycloak:
        condition: service_started
      harmoni-register:
        condition: service_started
      harmoniwatts-vivienda-api:
        condition: service_started
      harmoniwatts-electrodomesticos-api:
        condition: service_started
      harmoniwatts-insights-service:
        condition: service_healthy
    networks:
      - keycloak-network
      - harmoniwatts-backend

volumes:
  keycloak_postgres_data:
    name: keycloak_postgres_data
  keycloak_data:
    name: keycloak_data
  harmoniwatts_mongo_data:
    name: harmoniwatts_mongo_data
  harmoniwatts_frontend_node_modules:
    name: harmoniwatts_frontend_node_modules

networks:
  keycloak-network:
    name: keycloak-network
    driver: bridge
  harmoniwatts-backend:
    name: harmoniwatts-backend
    driver: bridge
