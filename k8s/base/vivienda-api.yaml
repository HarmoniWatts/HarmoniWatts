# API viviendas (Spring Boot). Ruta pública /api/v1/viviendas.
apiVersion: v1
kind: Service
metadata:
  name: vivienda-api
spec:
  selector:
    app.kubernetes.io/name: vivienda-api
  ports:
    - name: http
      port: 8082
      targetPort: 8082
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vivienda-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vivienda-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vivienda-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: vivienda-api
          image: harmoniwatts/vivienda-api
          ports:
            - containerPort: 8082
          env:
            - name: SERVER_PORT
              value: "8082"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/harmoniwatts
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_PASSWORD } }
            - name: KEYCLOAK_ISSUER_URI
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_ISSUER_URI } }
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_JWK_SET_URI } }
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8082 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8082 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
