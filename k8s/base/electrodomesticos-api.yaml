# API electrodomésticos (Spring Boot). Rutas públicas:
#   /api/v1/electrodomesticos/...  y  /api/v1/viviendas/{id}/electrodomesticos/...
apiVersion: v1
kind: Service
metadata:
  name: electrodomesticos-api
spec:
  selector:
    app.kubernetes.io/name: electrodomesticos-api
  ports:
    - name: http
      port: 8083
      targetPort: 8083
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: electrodomesticos-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: electrodomesticos-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: electrodomesticos-api
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: electrodomesticos-api
          image: harmoniwatts/electrodomesticos-api
          ports:
            - containerPort: 8083
          env:
            - name: SERVER_PORT
              value: "8083"
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/harmoniwatts
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_USER } }
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_PASSWORD } }
            - name: KEYCLOAK_ISSUER_URI
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_ISSUER_URI } }
            - name: KEYCLOAK_JWK_SET_URI
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_JWK_SET_URI } }
            # Visión en la nube con failover (docs/VISION-PROVIDERS.md)
            - name: HW_VISION_PROVIDER
              value: chain
            - name: HW_VISION_CHAIN_ORDER
              value: gemini,openai,mistral
            - name: HW_GEMINI_VISION_MODEL
              value: gemini-3.6-flash
            - name: HW_MISTRAL_VISION_MODEL
              value: pixtral-12b-2409
            - name: HW_OPENAI_VISION_MODEL
              value: gpt-4o-mini
            - name: GEMINI_API_KEY
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: GEMINI_API_KEY, optional: true } }
            - name: OPENAI_API_KEY
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: OPENAI_API_KEY, optional: true } }
            - name: MISTRAL_API_KEY
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: MISTRAL_API_KEY, optional: true } }
            - name: JAVA_TOOL_OPTIONS
              value: "-XX:MaxRAMPercentage=70 -XX:+UseSerialGC"
          startupProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /actuator/health/readiness, port: 8083 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /actuator/health/liveness, port: 8083 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { memory: 512Mi }
