# Keycloak en modo producción, servido en https://<APP_HOST>/auth detrás de Traefik.
# El realm se importa desde el ConfigMap "keycloak-realm" (deploy.sh lo genera desde
# keycloak-realm/realm-export.json, agregando el dominio a los redirect URIs del
# cliente harmoniwatts-frontend). La importación solo ocurre si el realm no existe.
apiVersion: v1
kind: Service
metadata:
  name: keycloak
spec:
  selector:
    app.kubernetes.io/name: keycloak
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: keycloak
  template:
    metadata:
      labels:
        app.kubernetes.io/name: keycloak
    spec:
      containers:
        - name: keycloak
          # Misma versión con la que se exportó keycloak-realm/realm-export.json
          image: quay.io/keycloak/keycloak:26.5.5
          args: ["start", "--import-realm"]
          ports:
            - name: http
              containerPort: 8080
            - name: management
              containerPort: 9000
          env:
            - name: KC_DB
              value: postgres
            - name: KC_DB_URL
              value: jdbc:postgresql://postgres:5432/keycloak_db
            - name: KC_DB_USERNAME
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_USER } }
            - name: KC_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: POSTGRES_PASSWORD } }
            - name: KC_BOOTSTRAP_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: KC_ADMIN_USERNAME } }
            - name: KC_BOOTSTRAP_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: KC_ADMIN_PASSWORD } }
            # URL pública completa (incluye /auth). Los servicios internos usan
            # http://keycloak:8080/auth gracias a hostname-backchannel-dynamic.
            - name: KC_HOSTNAME
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_PUBLIC_URL } }
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            - name: KC_HTTP_RELATIVE_PATH
              value: /auth
            - name: KC_HTTP_ENABLED
              value: "true"
            # TLS termina en Traefik, que envía X-Forwarded-*
            - name: KC_PROXY_HEADERS
              value: xforwarded
            - name: KC_HEALTH_ENABLED
              value: "true"
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=65 -XX:InitialRAMPercentage=30"
            # SMTP opcional (ver docs/KEYCLOAK-SMTP.md)
            - name: KC_SPI_EMAIL_SMTP_HOST
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: SMTP_HOST, optional: true } }
            - name: KC_SPI_EMAIL_SMTP_PORT
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: SMTP_PORT, optional: true } }
            - name: KC_SPI_EMAIL_SMTP_FROM
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: SMTP_FROM, optional: true } }
            - name: KC_SPI_EMAIL_SMTP_USER
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: SMTP_USER, optional: true } }
            - name: KC_SPI_EMAIL_SMTP_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: SMTP_PASSWORD, optional: true } }
            - name: KC_SPI_EMAIL_SMTP_STARTTLS
              value: "true"
          volumeMounts:
            - name: realm
              mountPath: /opt/keycloak/data/import
              readOnly: true
          startupProbe:
            httpGet: { path: /auth/health/started, port: management }
            periodSeconds: 10
            failureThreshold: 60
          readinessProbe:
            httpGet: { path: /auth/health/ready, port: management }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /auth/health/live, port: management }
            periodSeconds: 30
            failureThreshold: 5
          resources:
            requests: { cpu: 100m, memory: 512Mi }
            limits: { memory: 1Gi }
      volumes:
        - name: realm
          configMap:
            name: keycloak-realm
