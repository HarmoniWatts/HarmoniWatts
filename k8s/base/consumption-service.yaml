# consumption-service (FastAPI → MongoDB). Solo interno (lo consume insights-service).
apiVersion: v1
kind: Service
metadata:
  name: harmoniwatts-consumption-service
spec:
  selector:
    app.kubernetes.io/name: consumption-service
  ports:
    - name: http
      port: 8001
      targetPort: 8001
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consumption-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: consumption-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: consumption-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: consumption-service
          image: harmoniwatts/consumption-service
          ports:
            - containerPort: 8001
          env:
            - name: MONGODB_HOST
              value: harmoniwatts-mongodb
            - name: MONGODB_PORT
              value: "27017"
            - name: MONGODB_DATABASE
              value: harmoniwatts
            - name: ENVIRONMENT
              value: development
            - name: CONSUMPTION_COLLECTION
              value: consumos_enriquecidos
            - name: HOUSEHOLD_ID_TYPE
              value: int
            - name: DEFAULT_TIMEZONE
              value: America/Bogota
            - name: TARIFF_SERVICE_URL
              value: http://harmoniwatts-tariff-service:8006
          readinessProbe:
            httpGet: { path: /health, port: 8001 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8001 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { memory: 384Mi }
