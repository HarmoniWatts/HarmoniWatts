# harmoni-register (Node): registro, olvido de contraseña, perfil. Ruta pública /api/auth.
apiVersion: v1
kind: Service
metadata:
  name: harmoni-register
spec:
  selector:
    app.kubernetes.io/name: harmoni-register
  ports:
    - name: http
      port: 8081
      targetPort: 8081
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: harmoni-register
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: harmoni-register
  template:
    metadata:
      labels:
        app.kubernetes.io/name: harmoni-register
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: harmoni-register
          image: harmoniwatts/harmoni-register
          ports:
            - containerPort: 8081
          env:
            - name: PORT
              value: "8081"
            - name: KEYCLOAK_URL
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_INTERNAL_URL } }
            - name: KEYCLOAK_REALM
              valueFrom: { configMapKeyRef: { name: harmoniwatts-config, key: KEYCLOAK_REALM } }
            - name: KEYCLOAK_ADMIN_USERNAME
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: KC_ADMIN_USERNAME } }
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: harmoniwatts-secrets, key: KC_ADMIN_PASSWORD } }
            - name: KEYCLOAK_FRONTEND_CLIENT_ID
              value: harmoniwatts-frontend
          readinessProbe:
            httpGet: { path: /health, port: 8081 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8081 }
            initialDelaySeconds: 20
            periodSeconds: 30
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { memory: 192Mi }
