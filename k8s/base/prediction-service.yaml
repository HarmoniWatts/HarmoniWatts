# prediction-service (FastAPI + modelo MLflow, HAR-108). Solo interno.
# El modelo va dentro de la imagen (backend/prediction-service/app/model): para cambiarlo
# basta con reemplazar esos archivos y desplegar. Pide la historia horaria a
# consumption-service y guarda las predicciones en MongoDB.
apiVersion: v1
kind: Service
metadata:
  name: harmoniwatts-prediction-service
spec:
  selector:
    app.kubernetes.io/name: prediction-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: prediction-service
          image: harmoniwatts/prediction-service
          ports:
            - containerPort: 8000
          env:
            - name: ENVIRONMENT
              value: production
            - name: MONGODB_URL
              value: mongodb://harmoniwatts-mongodb:27017
            - name: MONGODB_DATABASE
              value: harmoniwatts
            - name: CONSUMPTION_SERVICE_URL
              value: http://harmoniwatts-consumption-service:8001
            - name: MLFLOW_MODEL_URI
              value: app/model
          # Cargar torch + el modelo tarda: margen de hasta 5 min antes de reiniciar
          startupProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 10
            failureThreshold: 30
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 15
          livenessProbe:
            httpGet: { path: /health, port: 8000 }
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 384Mi }
            limits: { memory: 1536Mi }
