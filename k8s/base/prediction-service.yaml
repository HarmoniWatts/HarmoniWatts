# prediction-service (Flask + Random Forest). Solo interno.
# Los modelos (.pkl) y CSV no están en git: se guardan en el PVC y se copian con
# kubectl cp (ver k8s/README.md). Sin ellos el servicio arranca pero no predice.
apiVersion: v1
kind: Service
metadata:
  name: harmoniwatts-prediction-service
spec:
  selector:
    app.kubernetes.io/name: prediction-service
  ports:
    - name: http
      port: 8000
      targetPort: 8000
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: prediction-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prediction-service
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: prediction-service
  template:
    metadata:
      labels:
        app.kubernetes.io/name: prediction-service
    spec:
      imagePullSecrets:
        - name: ghcr-pull
      securityContext:
        fsGroup: 1000
      containers:
        - name: prediction-service
          image: harmoniwatts/prediction-service
          ports:
            - containerPort: 8000
          volumeMounts:
            - name: data
              mountPath: /app/model
              subPath: model
            - name: data
              mountPath: /app/data
              subPath: data
          readinessProbe:
            tcpSocket: { port: 8000 }
            periodSeconds: 15
          livenessProbe:
            tcpSocket: { port: 8000 }
            initialDelaySeconds: 30
            periodSeconds: 30
          resources:
            requests: { cpu: 50m, memory: 192Mi }
            limits: { memory: 768Mi }
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: prediction-data
